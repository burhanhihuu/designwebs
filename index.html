<!DOCTYPE html>
<html lang="id">
<head>
    <title>Katalog Luxescent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white">

    <header class="text-center p-8 bg-black">
        <h1 class="text-4xl font-bold text-yellow-400">LUXESCENT</h1>
        <p class="text-gray-400">Feel Confident Everyday</p>
    </header>

    <main class="max-w-6xl mx-auto p-6">
        <h2 class="text-2xl font-bold text-center mb-8">
            Katalog Produk Parfum
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

            <!-- Produk 1 -->
            <div class="bg-gray-800 p-4 rounded-xl shadow-lg hover:scale-105 transition">
                <img src="https://images.unsplash.com/photo-1541643600914-78b084683601?w=400"
                     class="w-full h-40 object-cover rounded-lg">
                <span class="text-yellow-400">Best Seller</span>
                <h3 class="font-bold text-xl mt-2">Luxescent Gold</h3>
                <p class="text-gray-400">Rp250.000</p>
                <button class="bg-yellow-500 text-black p-2 mt-3 rounded-lg w-full hover:bg-yellow-300">
                    Beli Sekarang
                </button>
            </div>

            <!-- Produk 2 -->
            <div class="bg-gray-800 p-4 rounded-xl shadow-lg hover:scale-105 transition">
                <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400"
                     class="w-full h-40 object-cover rounded-lg">
                <span class="text-pink-400">Produk Baru</span>
                <h3 class="font-bold text-xl mt-2">Luxescent Bloom</h3>
                <p class="text-gray-400">Rp275.000</p>
                <button class="bg-yellow-500 text-black p-2 mt-3 rounded-lg w-full hover:bg-yellow-300">
                    Beli Sekarang
                </button>
            </div>

            <!-- Produk 3 -->
            <div class="bg-gray-800 p-4 rounded-xl shadow-lg hover:scale-105 transition">
                <img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=400"
                     class="w-full h-40 object-cover rounded-lg">
                <span class="text-purple-400">Premium</span>
                <h3 class="font-bold text-xl mt-2">Luxescent Royal</h3>
                <p class="text-gray-400">Rp300.000</p>
                <button class="bg-yellow-500 text-black p-2 mt-3 rounded-lg w-full hover:bg-yellow-300">
                    Beli Sekarang
                </button>
            </div>

            <!-- Produk 4 -->
            <div class="bg-gray-800 p-4 rounded-xl shadow-lg hover:scale-105 transition">
                <img src="https://images.unsplash.com/photo-1595425970377-c9703cf48b6d?w=400"
                     class="w-full h-40 object-cover rounded-lg">
                <span class="text-green-400">Favorite</span>
                <h3 class="font-bold text-xl mt-2">Luxescent Fresh</h3>
                <p class="text-gray-400">Rp225.000</p>
                <button class="bg-yellow-500 text-black p-2 mt-3 rounded-lg w-full hover:bg-yellow-300">
                    Beli Sekarang
                </button>
            </div>

        </div>
    </main>

    <footer class="bg-black text-center p-5 text-gray-400">
        Instagram: @luxescent.id
    </footer>

</body>
</html>
